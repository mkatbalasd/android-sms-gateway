plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.devtools.ksp'
    id 'com.google.gms.google-services'
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas".toString())
}

android {
    compileSdk 33

    defaultConfig {
        // Mnaseb SIM: own application id, installs beside the upstream app.
        // The Kotlin namespace stays me.capcom.smsgateway to keep rebases small.
        applicationId "com.mnaseb.sim"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // CARD-25: true only in the sendOnly build types below (no incoming-SMS permissions,
        // receivers or observers). The default two-way build keeps false.
        buildConfigField "boolean", "SEND_ONLY", "false"
    }
    buildFeatures {
        viewBinding true
    }
    signingConfigs {
        release {
            storeFile file("keystore.jks")
            storePassword System.getenv("SIGNING_STORE_PASSWORD")
            keyAlias System.getenv("SIGNING_KEY_ALIAS")
            keyPassword System.getenv("SIGNING_KEY_PASSWORD")
        }
    }
    buildTypes {
        debug {
            debuggable true
            manifestPlaceholders = [networkSecurityConfig: "@xml/network_security_config"]
        }
        debugInsecure {
            debuggable true
            manifestPlaceholders = [networkSecurityConfig: "@xml/network_security_config_insecure"]
            signingConfig signingConfigs.debug
        }
        insecure {
            initWith debug
            debuggable true
            signingConfig signingConfigs.release
            manifestPlaceholders = [networkSecurityConfig: "@xml/network_security_config_insecure"]
        }
        // Mnaseb SIM e2e: debug-signed, cleartext allowed, and the ONLY build type that carries
        // the stub-server endpoint override (source set src/e2eOn, below). Never shipped.
        emulatorE2e {
            initWith debug
            debuggable true
            // distinct package: never replaces or collides with an installed Mnaseb SIM
            applicationIdSuffix ".e2e"
            signingConfig signingConfigs.debug
            manifestPlaceholders = [networkSecurityConfig: "@xml/network_security_config_insecure"]
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Mnaseb SIM: without app/keystore.jks the release APK is built
            // unsigned (never debug-signed); CI signs it with apksigner.
            signingConfig file("keystore.jks").exists() ? signingConfigs.release : null
            manifestPlaceholders = [networkSecurityConfig: "@xml/network_security_config"]
        }
        // CARD-25 send-only build: the release build WITHOUT RECEIVE_SMS, READ_SMS, RECEIVE_MMS and
        // RECEIVE_WAP_PUSH (src/sendOnly/AndroidManifest.xml removes them and the incoming
        // receivers). Same application id and the same release signing as `release`, so the
        // two-way release asset is untouched. Built only by `assembleSendOnly`.
        sendOnly {
            initWith release
            matchingFallbacks = ['release']
            signingConfig file("keystore.jks").exists() ? signingConfigs.release : null
            manifestPlaceholders = [networkSecurityConfig: "@xml/network_security_config"]
            buildConfigField "boolean", "SEND_ONLY", "true"
        }
        // CARD-25 e2e: the send-only manifest and code with the stub endpoint override, debug-signed.
        // The same ".e2e" id as emulatorE2e (never installed together: separate CI jobs) so the
        // existing e2e tests run unchanged against it.
        sendOnlyE2e {
            initWith emulatorE2e
            matchingFallbacks = ['emulatorE2e', 'debug']
            applicationIdSuffix ".e2e"
            signingConfig signingConfigs.debug
            buildConfigField "boolean", "SEND_ONLY", "true"
        }
    }
    // Endpoint override (T2): emulatorE2e compiles src/e2eOn (stub URL), every other build type
    // compiles src/e2eOff (no override, no strings). A release build can therefore never carry it.
    sourceSets {
        debug.java.srcDir 'src/e2eOff/java'
        debugInsecure.java.srcDir 'src/e2eOff/java'
        insecure.java.srcDir 'src/e2eOff/java'
        release.java.srcDir 'src/e2eOff/java'
        emulatorE2e.java.srcDir 'src/e2eOn/java'
        sendOnly.java.srcDir 'src/e2eOff/java'
        sendOnlyE2e.java.srcDir 'src/e2eOn/java'
        sendOnlyE2e.manifest.srcFile 'src/sendOnly/AndroidManifest.xml'
        // The emulator e2e tests only exist for -Pe2eBuildType=emulatorE2e, so the existing
        // Instrumented Tests job (debug build, production URLs) never compiles or runs them.
        if (project.findProperty('e2eBuildType') in ['emulatorE2e', 'sendOnlyE2e']) {
            androidTest.java.srcDir 'src/androidTestE2e/java'
        }
    }
    testBuildType(project.findProperty('e2eBuildType') ?: 'debug')
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    packagingOptions {
        exclude 'META-INF/INDEX.LIST'
        exclude 'META-INF/io.netty.versions.properties'
    }
    namespace 'me.capcom.smsgateway'

    testOptions {
        unitTests {
            // EventBus.emit logs via android.util.Log; local unit tests must not
            // fail on the mockable android.jar "not mocked" stub.
            returnDefaultValues = true
        }
    }
}

// The emulatorE2e variant points at the stub server by design, so the JVM suites that assert the
// production URLs (and `./gradlew test`) skip it; its override is proven by the CI release guard.
androidComponents {
    beforeVariants(selector().withBuildType("emulatorE2e")) { variantBuilder ->
        variantBuilder.enableUnitTest = false
    }
    // CARD-25: the send-only types are built, not unit-tested (the JVM suites run on debug/release).
    beforeVariants(selector().withBuildType("sendOnly")) { variantBuilder ->
        variantBuilder.enableUnitTest = false
    }
    beforeVariants(selector().withBuildType("sendOnlyE2e")) { variantBuilder ->
        variantBuilder.enableUnitTest = false
    }
}

dependencies {
    def ktor_version = "2.2.4"
    def okhttp_version = "4.10.0"
    def room_version = "2.4.3"
    def coroutines_version = "1.6.1"
    def work_version = "2.7.1"
    def koin_version = "3.4.0"
    def lifecycle_version = "2.6.2"

    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version")

    implementation("io.ktor:ktor-serialization-gson:$ktor_version")

    implementation("io.ktor:ktor-server-core:$ktor_version")
    implementation("io.ktor:ktor-server-netty:$ktor_version")
    implementation("io.ktor:ktor-server-compression:$ktor_version")
    implementation("io.ktor:ktor-server-status-pages:$ktor_version")
    implementation("io.ktor:ktor-server-content-negotiation:$ktor_version")
    implementation("io.ktor:ktor-server-call-logging:$ktor_version")
    implementation("io.ktor:ktor-server-auth:$ktor_version")
    implementation("io.ktor:ktor-server-auth-jwt:$ktor_version")

    implementation("io.ktor:ktor-client-core:$ktor_version")
    implementation("io.ktor:ktor-client-content-negotiation:$ktor_version")
    implementation("io.ktor:ktor-client-okhttp:$ktor_version")

    implementation("com.squareup.okhttp3:okhttp:$okhttp_version")
    implementation("com.squareup.okhttp3:okhttp-sse:$okhttp_version")

    // Kotlin + coroutines
    implementation "androidx.work:work-runtime-ktx:$work_version"

    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"

    implementation("androidx.preference:preference-ktx:1.2.0")

    implementation("androidx.core:core-ktx:1.8.0")
    implementation("androidx.appcompat:appcompat:1.4.2")
    implementation("com.google.android.material:material:1.6.1")
    implementation("androidx.constraintlayout:constraintlayout:2.1.4")
    implementation 'androidx.preference:preference-ktx:1.2.1'
    // Mnaseb SIM v0.3.0: «افتح لوحة التحكم» opens the workspace in a Custom Tab.
    implementation("androidx.browser:browser:1.5.0")

    implementation("com.aventrix.jnanoid:jnanoid:2.0.0")

    implementation("androidx.room:room-ktx:$room_version")
    ksp("androidx.room:room-compiler:$room_version")

    // Import the Firebase BoM
    implementation platform('com.google.firebase:firebase-bom:31.1.1')
    implementation 'com.google.firebase:firebase-messaging-ktx'

    implementation 'com.googlecode.libphonenumber:libphonenumber:9.0.22'

    // Mnaseb SIM: QR scan of the link code. No GMS dependency (Huawei phones).
    // minSdk 21: per the library README, zxing core is pinned to 3.3.0
    // (3.4+ needs API 24) and transitive deps are off.
    implementation('com.journeyapps:zxing-android-embedded:4.3.0') { transitive = false }
    implementation 'com.google.zxing:core:3.3.0'

    // Koin for Android
    implementation "io.insert-koin:koin-android:$koin_version"

    // Mnaseb SIM v0.3.0: the account tokens live in EncryptedSharedPreferences.
    // 1.1.0-alpha06 is the line that supports minSdk 21 (1.0.0 needs API 23).
    implementation("androidx.security:security-crypto:1.1.0-alpha06")

    testImplementation("junit:junit:4.13.2")
    // Mnaseb SIM v0.3.0: Ktor MockEngine for the account API tests.
    testImplementation("io.ktor:ktor-client-mock:$ktor_version")
    testImplementation("androidx.arch.core:core-testing:2.1.0")
    testImplementation("org.jetbrains.kotlinx:kotlinx-coroutines-test:$coroutines_version")
    androidTestImplementation("androidx.test.ext:junit:1.1.3")
    androidTestImplementation("androidx.test.espresso:espresso-core:3.4.0")
    // Mnaseb SIM emulator e2e: permission dialogs and the system UI.
    androidTestImplementation("androidx.test.uiautomator:uiautomator:2.2.0")
}
