name: Mnaseb SIM Unit Tests

# Runs the JVM unit tests (the same `./gradlew test` as mnaseb-sim-release.yml)
# on every pull request to mnaseb-sim, so they have a result before merge.
# No secrets: a placeholder google-services.json only satisfies the
# google-services Gradle plugin.

on:
  pull_request:
    branches: [mnaseb-sim]

permissions:
  contents: read

concurrency:
  group: mnaseb-sim-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup JAVA 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1

      - name: Placeholder google-services.json
        run: |
          cat > ./app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder-project",
              "storage_bucket": "placeholder-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.mnaseb.sim" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSy000000000000000000000000000000000" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Unit tests
        run: ./gradlew test
